---
# HISS-21 platform neutrality: lint, type check and unit tests on Linux, macOS and Windows.
# .github/rulesets/main.json lists every leg; apply it to the forge only after each leg's first hosted green (#328).
name: Platform Neutrality

'on':
  pull_request:
    branches: [main, 'lts-*']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'lts-*']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portability:
    name: Platform Neutrality (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-26.04
          - name: macOS
            runner: macos-26
          - name: Windows
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: ./.github/actions/pnpm-install
        with:
          store-cache: 'false'
      - name: Detect affected packages and surfaces
        id: changes
        uses: ./.github/actions/detect-affected
      - name: Lint
        env:
          TASK: lint
          TURBO_FILTER: ${{ steps.changes.outputs.turbo_filter }}
          ALL_AFFECTED: ${{ steps.changes.outputs.all_affected }}
          CI_EVENT: ${{ github.event_name }}
        run: &scoped_turbo |
          if [ "$CI_EVENT" = "pull_request" ] && [ "$ALL_AFFECTED" != "true" ] && [ -z "$TURBO_FILTER" ]; then
            echo "ci-scope: skip (zero affected packages)"
            exit 0
          fi
          # shellcheck disable=SC2086
          if [ -n "$TURBO_FILTER" ]; then
            pnpm exec turbo run "$TASK" ${TASK_ARGS:-} $TURBO_FILTER
          else
            pnpm "$TASK" ${TASK_ARGS:-}
          fi
      - name: Type check
        env:
          TASK: typecheck
          TURBO_FILTER: ${{ steps.changes.outputs.turbo_filter }}
          ALL_AFFECTED: ${{ steps.changes.outputs.all_affected }}
          CI_EVENT: ${{ github.event_name }}
        run: *scoped_turbo
      # Turbo starts up to 10 package test tasks at once and each Vitest run
      # takes cores - 1 workers, which oversubscribes the 3-core, 7 GB macOS
      # runner: tests that take about 50 ms alone took 1 to 7 s there and
      # crossed the 5 s timeout. Two packages at a time keeps every leg bounded.
      - name: Test
        env:
          TASK: test
          TASK_ARGS: --concurrency=2
          TURBO_FILTER: ${{ steps.changes.outputs.turbo_filter }}
          ALL_AFFECTED: ${{ steps.changes.outputs.all_affected }}
          CI_EVENT: ${{ github.event_name }}
        run: *scoped_turbo
      # HISS-21: the ruleset check runs on every platform leg.
      - name: Ruleset check
        run: pnpm check:ruleset
      - name: Ruleset check tests
        run: node --test scripts/check-ruleset.test.mjs scripts/check-ruleset-contract.test.mjs scripts/check-ruleset-target.test.mjs scripts/check-ruleset-contexts.test.mjs scripts/check-ruleset-contexts-review.test.mjs scripts/check-ruleset-workflows.test.mjs
      # HISS-21: the migration codemod check spawns a worker per transform call and builds
      # file URLs, both platform-sensitive; run the check and its tests on every leg.
      - run: pnpm check:migration-codemods
      - run: >-
          node --test scripts/check-migration-codemods.test.mjs
          scripts/check-migration-codemods-transforms.test.mjs
      # HISS-21: commit-message and pre-push checks spawn git; hook tests also spawn sh.
      # Exercise the hook and its quoted message path on every leg.
      - run: >-
          node --test scripts/check-commit-message.test.mjs
          scripts/check-commit-message.lefthook.test.mjs
          scripts/check-pushed-commits.test.mjs
